<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; form-action https://www.google.com">
  <meta name="color-scheme" content="light dark">
  <title>Tab baru</title>
  <style>
    :root { color-scheme: light dark; --bg: #fff; --text: #202124; --muted: #5f6368; --box: #fff; --line: #dfe1e5; --shadow: 0 1px 6px #20212447; --blue: #1a73e8; --chip: #f1f3f4; }
    @media (prefers-color-scheme: dark) { :root { --bg: #202124; --text: #e8eaed; --muted: #9aa0a6; --box: #303134; --line: #5f6368; --shadow: none; --blue: #8ab4f8; --chip: #35363a; } }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; background: var(--bg); color: var(--text); font: 15px "Segoe UI", system-ui, sans-serif; }
    h1 { margin: 0; font-size: 72px; font-weight: 600; letter-spacing: -3px; }
    h1 span:nth-child(1) { color: #4285f4; } h1 span:nth-child(2) { color: #ea4335; } h1 span:nth-child(3) { color: #fbbc05; }
    h1 span:nth-child(4) { color: #4285f4; } h1 span:nth-child(5) { color: #34a853; } h1 span:nth-child(6) { color: #ea4335; }
    h1 span:nth-child(n+7) { color: var(--text); }
    form { position: relative; width: min(584px, 88vw); }
    input { width: 100%; box-sizing: border-box; height: 46px; padding: 0 52px 0 20px; border-radius: 23px; border: 1px solid var(--line); background: var(--box); color: inherit; font: inherit; font-size: 16px; }
    input:hover, input:focus { box-shadow: var(--shadow); outline: 0; border-color: transparent; }
    a.lens { position: absolute; right: 8px; top: 7px; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); }
    a.lens:hover { background: var(--chip); }
    a.lens svg { width: 22px; height: 22px; fill: currentColor; }
    #shortcuts { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; width: min(640px, 90vw); min-height: 96px; }
    #shortcuts a { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 96px; padding: 12px 4px; border-radius: 8px; color: var(--text); text-decoration: none; font-size: 12px; }
    #shortcuts a:hover { background: var(--chip); }
    #shortcuts .dot { width: 48px; height: 48px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-size: 20px; font-weight: 600; color: var(--blue); }
    #shortcuts .name { max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    footer { position: fixed; bottom: 14px; color: var(--muted); font-size: 12px; text-align: center; padding: 0 16px; }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <h1 aria-label="tketlon"><span>t</span><span>k</span><span>e</span><span>t</span><span>l</span><span>o</span><span>n</span></h1>
  <form action="https://www.google.com/search" method="get">
    <input name="q" placeholder="Telusuri Google atau ketik URL" autofocus autocomplete="off">
    <a class="lens" href="https://lens.google.com/" title="Telusuri dengan Google Lens" aria-label="Google Lens">
      <svg viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm-7 7H3v4c0 1.1.9 2 2 2h4v-2H5v-4zM5 5h4V3H5c-1.1 0-2 .9-2 2v4h2V5zm14-2h-4v2h4v4h2V5c0-1.1-.9-2-2-2zm0 16h-4v2h4c1.1 0 2-.9 2-2v-4h-2v4z"/></svg>
    </a>
  </form>
  <div id="shortcuts"></div>
  <footer>Sesi sementara: cookie dan data situs hilang saat Reset Identity. Bookmark dan pengaturan disimpan lokal di perangkat ini. &middot; Tketlon Browser &middot; Cincop by <a href="https://github.com/AmegoVerse/">AtaLioMego</a></footer>
  <script src="newtab.js"></script>
</body>
</html>
