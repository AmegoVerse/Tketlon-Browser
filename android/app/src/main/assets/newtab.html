<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; form-action https://www.google.com">
<title>Tab baru</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #0a1020; color: #e7ecf8; font: 16px system-ui, sans-serif; }
  main { width: min(520px, 90vw); }
  h1 { margin: 0 0 20px; font-size: 38px; letter-spacing: -1px; }
  input { width: 100%; box-sizing: border-box; height: 46px; padding: 0 18px; border-radius: 23px; border: 1px solid #2a3a63; background: #111a30; color: inherit; font: inherit; }
  input:focus { outline: 2px solid #2f7df6; border-color: transparent; }
  p { margin: 18px 4px 0; color: #8a97b5; line-height: 1.5; font-size: 14px; }
  b { color: #2ad4f0; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>tketlon</h1>
  <form action="https://www.google.com/search" method="get"><input name="q" placeholder="Cari di web" autocomplete="off"></form>
  <p><b>Sesi sementara.</b> Data situs dihapus saat aplikasi dibuka dan saat Reset Identity.</p>
</main>
</body>
</html>
